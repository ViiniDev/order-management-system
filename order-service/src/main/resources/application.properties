spring.application.name=order-service
server.port=${SERVER_PORT:8082}

app.product-service-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
app.rabbitmq.exchange=orders.exchange
app.rabbitmq.queue=orders.created.queue
app.rabbitmq.routing-key=orders.created
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.listener.simple.auto-startup=${RABBIT_LISTENER_AUTO_STARTUP:false}
